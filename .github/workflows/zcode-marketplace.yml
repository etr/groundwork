name: Publish ZCode marketplace

# Rebuilds the ZCode marketplace bundle (translated skills, native agents,
# filtered hooks) and force-pushes it to the orphan `zcode-marketplace`
# branch. ZCode users add that branch as a marketplace:
#   etr/groundwork#zcode-marketplace
# The branch is generated output — never edited by hand.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Build bundle
        run: bash build-zcode-marketplace.sh dist/zcode-marketplace

      - name: Publish to zcode-marketplace branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist/zcode-marketplace
          git init -q
          git config user.name "groundwork-ci"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "ZCode marketplace bundle (v$(node -p "require('./.zcode-plugin/plugin.json').version")"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/zcode-marketplace
